name: geotravel

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geotravel}
      POSTGRES_USER: ${POSTGRES_USER:-geotravel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geotravel}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geotravel}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Aplica las migraciones de db/migrations al levantar (solo las que falten; se puede repetir
  # sin problema). Corre, termina y queda en "Exited (0)": es lo esperado.
  flyway:
    image: flyway/flyway:10
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../db/migrations:/flyway/migrations
    # La conexión va por variables de entorno (no por 'command'), porque
    # "docker compose run flyway migrate" reemplaza el command completo.
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-geotravel}
      FLYWAY_USER: ${POSTGRES_USER:-geotravel}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-geotravel}
      FLYWAY_CONNECT_RETRIES: "10"
      FLYWAY_LOCATIONS: filesystem:/flyway/migrations
    command: migrate

  # Carga la red vial (db/data) y los datos de prueba (db/seed) una sola vez: ver init/seed.sh,
  # no duplica nada si ya están.
  seed:
    image: postgis/postgis:16-3.4
    depends_on:
      flyway:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geotravel}
      POSTGRES_USER: ${POSTGRES_USER:-geotravel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geotravel}
    volumes:
      - ./init/seed.sh:/init/seed.sh:ro
      - ../db/seed:/seed:ro
      - ../db/data:/data:ro
    entrypoint: ["/bin/sh", "/init/seed.sh"]

  # Configura GeoServer por REST: workspace, store PostGIS, capas y estilos SLD
  # (ver init/geoserver-init.sh). Es repetible: lo que ya existe se deja como está.
  geoserver-init:
    image: curlimages/curl:8.10.1
    user: "0:0"
    depends_on:
      geoserver:
        condition: service_started
      seed:
        condition: service_completed_successfully
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER:-admin}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:-geoserver}
      POSTGRES_DB: ${POSTGRES_DB:-geotravel}
      POSTGRES_USER: ${POSTGRES_USER:-geotravel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geotravel}
    volumes:
      - ./init/geoserver-init.sh:/init/geoserver-init.sh:ro
      - ../geoserver/styles:/custom_styles:ro
      - geoserver_data:/opt/geoserver/data_dir
    entrypoint: ["/bin/sh", "/init/geoserver-init.sh"]

  # Opcional: compila el .war en backend/target sin levantar nada (el servicio 'backend' ya
  # lo compila solo al hacer "up --build"). Útil para revisar errores de compilación:
  #   docker compose --profile tools run --rm backend-build
  backend-build:
    image: maven:3.9-eclipse-temurin-17
    profiles: ["tools"]
    working_dir: /app
    volumes:
      - ../backend:/app
      - m2cache:/root/.m2
    command: mvn -B -DskipTests clean package

  # Tomcat 9 con el .war ya adentro: se construye desde backend/Dockerfile (compila con Maven).
  # Tras cambiar código del backend alcanza con: docker compose up -d --build
  backend:
    build: ../backend
    depends_on:
      db:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-geotravel}
      DB_USER: ${POSTGRES_USER:-geotravel}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-geotravel}
      OSRM_URL: ${OSRM_URL:-https://router.project-osrm.org}
      # Sin valor: el criterio "mas corta" queda desactivado (responde 503). Ver docs/RECURSOS_CERCANOS_RUTAS.md
      OSRM_FAST_URL: ${OSRM_FAST_URL:-}
      OSRM_SHORTEST_URL: ${OSRM_SHORTEST_URL:-}
      IDE_DEPARTAMENTO: ${IDE_DEPARTAMENTO:-salto}
      IDE_LOCALIDAD: ${IDE_LOCALIDAD:-salto}
      FOTOS_DIR: /data/fotos
      # Login básico del administrador (un único usuario de prueba). Cambiar la clave fuera de desarrollo.
      ADMIN_USUARIO: ${ADMIN_USUARIO:-admin}
      ADMIN_CLAVE: ${ADMIN_CLAVE:-urbansafe}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - fotos_data:/data/fotos   # fotos subidas: sobreviven a los redespliegues del .war

  # OSRM propio (opcional, profile "osrm"): dos servicios con datos procesados con perfiles distintos.
  # Preparar antes los datos con infra/osrm/preparar.ps1 (o .sh) y definir en .env:
  #   OSRM_FAST_URL=http://osrm-fast:5000   OSRM_SHORTEST_URL=http://osrm-shortest:5000
  # Levantar con: docker compose --profile osrm up -d --build
  osrm-fast:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    profiles: ["osrm"]
    command: osrm-routed --algorithm mld /data/mapa.osrm
    volumes:
      - ./osrm/data/fast:/data:ro
    ports:
      - "${OSRM_FAST_PORT:-5001}:5000"

  osrm-shortest:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    profiles: ["osrm"]
    command: osrm-routed --algorithm mld /data/mapa.osrm
    volumes:
      - ./osrm/data/shortest:/data:ro
    ports:
      - "${OSRM_SHORTEST_PORT:-5002}:5000"

  geoserver:
    image: kartoza/geoserver:2.25.2
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER:-admin}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:-geoserver}
      GEOSERVER_DATA_DIR: /opt/geoserver/data_dir
    ports:
      - "${GEOSERVER_PORT:-8082}:8080"
    volumes:
      - geoserver_data:/opt/geoserver/data_dir
    depends_on:
      - db

volumes:
  pgdata:
  geoserver_data:
  m2cache:
  fotos_data:
