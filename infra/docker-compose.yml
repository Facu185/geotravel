name: geotravel

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geotravel}
      POSTGRES_USER: ${POSTGRES_USER:-geotravel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geotravel}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geotravel}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Aplica las migraciones de db/migrations contra el servicio 'db'.
  # No arranca solo (profile "tools"): correrlo a mano con
  #   docker compose --profile tools run --rm flyway migrate
  flyway:
    image: flyway/flyway:10
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../db/migrations:/flyway/migrations
    # La conexión va por variables de entorno (no por 'command'), porque
    # "docker compose run flyway migrate" reemplaza el command completo.
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-geotravel}
      FLYWAY_USER: ${POSTGRES_USER:-geotravel}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-geotravel}
      FLYWAY_CONNECT_RETRIES: "10"
      FLYWAY_LOCATIONS: filesystem:/flyway/migrations
    command: migrate

  # Compila el backend con Maven dentro de Docker (no hace falta instalar Maven).
  # Genera backend/target/geotravel.war. Correrlo a mano con
  #   docker compose --profile tools run --rm backend-build
  backend-build:
    image: maven:3.9-eclipse-temurin-17
    profiles: ["tools"]
    working_dir: /app
    volumes:
      - ../backend:/app
      - m2cache:/root/.m2
    command: mvn -B -DskipTests clean package

  # Tomcat 9 (javax.*, el namespace que usa el backend). El .war NO va montado como
  # volumen: se copia con "docker compose cp" y Tomcat lo despliega solo (ver README).
  backend:
    image: tomcat:9.0-jdk17-temurin
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-geotravel}
      DB_USER: ${POSTGRES_USER:-geotravel}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-geotravel}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  geoserver:
    image: kartoza/geoserver:2.25.2
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER:-admin}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:-geoserver}
      GEOSERVER_DATA_DIR: /opt/geoserver/data_dir
    ports:
      - "${GEOSERVER_PORT:-8082}:8080"
    volumes:
      - geoserver_data:/opt/geoserver/data_dir
    depends_on:
      - db

volumes:
  pgdata:
  geoserver_data:
  m2cache:
