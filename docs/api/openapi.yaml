openapi: 3.0.3
info:
  title: UrbanSafe API
  version: "0.2.0"
  description: >
    Contrato REST del backend. Actualizar este archivo en el mismo PR que agregue
    o cambie un endpoint (ver CONTRIBUTING.md). Base path real: /geotravel/api
    (definido en backend/src/main/webapp/WEB-INF/web.xml; el nombre del artefacto
    quedó como "geotravel" por continuidad con el repo, no tiene que ver con el
    dominio del proyecto).

    Convención de coordenadas: los cuerpos de alta/edición (geomGeoJson) van en
    GeoJSON lon/lat (EPSG:4326) -- es lo que produce Leaflet. Los parámetros x/y de
    las consultas geográficas van en EPSG:32721 (metros), el SRID de la base.
servers:
  - url: http://localhost:8080/geotravel/api

# Seguridad: toda la API exige una sesión de administrador (encabezado Authorization: Bearer <token>) salvo
# /health, /auth/login, /auth/logout, GET /fotos/... y la lectura que usan las Consultas del invitado:
# GET /consultas/... (menos /consultas/reportes), GET /zonas, /incidentes y /recursos (listado, sin id), GET /eta/disponible. Sin token, el resto responde 401.
# El mapa público no pasa por esta API: lo dibuja GeoServer.
security:
  - bearerAuth: []

paths:
  /health:
    get:
      summary: Estado del servicio
      security: []
      responses:
        "200": { description: OK }

  # ------------------------------------------------------------ ETA / pgRouting
  /eta/disponible:
    get:
      summary: Si se pueden calcular rutas en el servidor
      description: >
        La base debe tener pgRouting, la función de rutas y la red vial cargada (servicio red-vial). El resultado se
        cachea 5 s.
      responses:
        "200": { description: 'Ej. {"disponible":true,"motivo":null}; si falta algo, {"disponible":false,"motivo":"..."}' }

  /eta/recursos/{recursoId}/incidentes/{incidenteId}:
    get:
      summary: Calcular tiempo estimado de llegada
      description: >
        Obtiene las ubicaciones del recurso y del incidente desde PostGIS.
        Calcula con pgRouting (dentro de PostgreSQL, sobre la red vial de OpenStreetMap de todo Uruguay) la distancia, la
        duración y el recorrido por calles, respetando los sentidos de circulación. Hay un solo camino: el de menor
        duración (con la velocidad de cada calle). Cada extremo se engancha al punto exacto de la calle
        más cercana (hasta 500 m) y el trazado llega hasta el recurso y el incidente. Devuelve también las calles del
        recorrido. La geometría es GeoJSON en EPSG:4326. No incorpora tráfico en tiempo real. Ver docs/RED_VIAL.md.
      tags: [eta]
      parameters:
        - name: recursoId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: incidenteId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: ETA calculada correctamente
          content:
            application/json:
              schema:
                type: object
                required:
                  - recursoId
                  - incidenteId
                  - distanciaMetros
                  - duracionSegundos
                  - tiempoEstimadoMinutos
                  - geometriaRuta
                  - motor
                  - aclaracion
                properties:
                  recursoId:
                    type: integer
                  incidenteId:
                    type: integer
                  distanciaMetros:
                    type: integer
                    minimum: 0
                  duracionSegundos:
                    type: integer
                    minimum: 0
                  tiempoEstimadoMinutos:
                    type: integer
                    minimum: 0
                  distanciaDirectaMetros: { type: number, description: Línea recta recurso-incidente }
                  ajusteOrigenMetros: { type: number, nullable: true, description: Distancia a la calle más cercana (origen) }
                  ajusteDestinoMetros: { type: number, nullable: true, description: Distancia a la calle más cercana (destino) }
                  advertencia: { type: string, nullable: true, description: Presente si el ajuste a la calle es >= 100 m }
                  geometriaRuta:
                    type: object
                    description: >
                      Recorrido vial GeoJSON LineString. Coordenadas en orden
                      lon, lat, sistema EPSG:4326.
                    required: [type, coordinates]
                    properties:
                      type:
                        type: string
                        enum: [LineString]
                      coordinates:
                        type: array
                        minItems: 2
                        items:
                          type: array
                          minItems: 2
                          items:
                            type: number
                  calles:
                    type: array
                    description: Las calles del recorrido, en orden, con los metros que se recorren por cada una
                    items:
                      type: object
                      properties:
                        calle: { type: string, example: Avenida Juan Harriague }
                        metros: { type: number, example: 254 }
                  motor:
                    type: string
                    example: pgRouting (PostgreSQL)
                  aclaracion:
                    type: string
                    example: Estimacion sin trafico en tiempo real
        "400":
          $ref: "#/components/responses/DatosInvalidos"
        "404":
          $ref: "#/components/responses/NoExiste"
        "422":
          description: No hay camino por calles entre los dos puntos (alguno queda a más de 500 m de cualquier calle)
        "503":
          description: Falta pgRouting, la red vial o la función de rutas en la base

  /eta/incidentes/{incidenteId}/recurso-mas-cercano:
    get:
      summary: Recurso más cercano a un incidente por las calles, con su ruta
      description: >
        "Más cercano" por las calles, no en línea recta. PostGIS toma los N recursos más cercanos en línea recta
        (por defecto 5; solo los disponibles) y pgRouting calcula la ruta de cada uno respetando los sentidos de circulación;
        gana el mejor según el criterio: el de menor distancia por calles (`distancia`, por defecto) o el que llega antes
        (`tiempo`); en un empate decide el otro dato. El incidente puede ser un punto, una línea o un polígono: el destino de cada ruta es el punto del incidente más próximo al recurso. Se devuelven también los otros
        recursos evaluados, con su tiempo o el motivo por el que no tienen ruta. Exige sesión de administrador.
        Ver docs/RED_VIAL.md.
      tags: [eta]
      parameters:
        - { name: incidenteId, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - name: soloDisponibles
          in: query
          required: false
          schema: { type: boolean, default: true }
          description: Si es true, solo se consideran los recursos con estado operativo Disponible
        - name: candidatos
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 10, default: 5 }
          description: Cuántos recursos (los más cercanos en línea recta) se evalúan por calles
        - name: criterio
          in: query
          required: false
          schema: { type: string, enum: [distancia, tiempo], default: distancia }
          description: Qué se minimiza al buscar el camino. distancia = el más corto en metros; tiempo = el más rápido.
      responses:
        "200":
          description: Recurso elegido y su ruta
          content:
            application/json:
              schema:
                type: object
                properties:
                  incidente:
                    type: object
                    properties:
                      id: { type: integer }
                      titulo: { type: string }
                      tipoIncidente: { type: string }
                      estado: { type: string }
                      geom: { type: object, description: Geometría del incidente, GeoJSON lon/lat }
                  recurso:
                    type: object
                    description: El recurso elegido
                    properties:
                      id: { type: integer }
                      identificacion: { type: string }
                      nombre: { type: string, nullable: true }
                      tipo: { type: string }
                      estadoOperativo: { type: string }
                      geom: { type: object, description: Ubicación del recurso, GeoJSON Point lon/lat }
                  ruta:
                    type: object
                    properties:
                      distanciaMetros: { type: integer }
                      duracionSegundos: { type: integer }
                      tiempoEstimadoMinutos: { type: integer }
                      distanciaDirectaMetros: { type: integer }
                      geometriaRuta: { type: object, description: GeoJSON LineString lon/lat }
                      calles:
                        type: array
                        items:
                          type: object
                          properties:
                            calle: { type: string }
                            metros: { type: number }
                      ajusteOrigenMetros: { type: integer, nullable: true }
                      ajusteDestinoMetros: { type: integer, nullable: true }
                      advertencia: { type: string, nullable: true }
                  criterio: { type: string, example: Menor tiempo por calles entre los 5 recursos disponibles mas cercanos en linea recta }
                  soloDisponibles: { type: boolean }
                  candidatosEvaluados: { type: integer }
                  alternativas:
                    type: array
                    description: Todos los recursos evaluados, en orden de cercanía en línea recta
                    items:
                      type: object
                      properties:
                        recursoId: { type: integer }
                        identificacion: { type: string }
                        tipo: { type: string }
                        estadoOperativo: { type: string }
                        distanciaDirectaMetros: { type: integer }
                        estadoRuta: { type: string, enum: [disponible, sin_ruta, error, plazo_agotado, no_consultado] }
                        distanciaMetros: { type: integer, description: Solo con ruta }
                        duracionSegundos: { type: integer, description: Solo con ruta }
                        tiempoEstimadoMinutos: { type: integer, description: Solo con ruta }
                        mensaje: { type: string, description: Solo sin ruta }
                        elegido: { type: boolean }
                  motor: { type: string, example: pgRouting (PostgreSQL) }
                  aclaracion: { type: string }
        "400":
          $ref: "#/components/responses/DatosInvalidos"
        "404":
          $ref: "#/components/responses/NoExiste"
        "422":
          description: No hay recursos disponibles, o ninguno de los evaluados tiene ruta por calles hasta el incidente
        "503":
          description: Falta pgRouting o la red vial, el motor no respondió o el cálculo superó el tiempo disponible

  # ------------------------------------------------------------ Ingreso del administrador
  /auth/login:
    post:
      summary: Ingresa como administrador y devuelve el token de la sesión (vale 8 horas)
      description: >
        Hay un único usuario de prueba, configurado con las variables ADMIN_USUARIO y ADMIN_CLAVE
        (por defecto admin / urbansafe). Las sesiones viven en memoria: si se reinicia el backend hay que ingresar de nuevo.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [usuario, clave]
              properties:
                usuario: { type: string }
                clave: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  usuario: { type: string }
                  rol: { type: string, example: admin }
                  venceEnHoras: { type: integer }
        "401": { description: Usuario o contraseña incorrectos }

  /auth/logout:
    post:
      summary: Cierra la sesión del token que se manda
      tags: [auth]
      security: []
      responses:
        "204": { description: Sesión cerrada }

  /auth/yo:
    get:
      summary: Datos de la sesión actual (sirve para comprobar que el token sigue vigente)
      tags: [auth]
      responses:
        "200": { description: OK }
        "401": { description: Sin sesión o vencida }

  # ------------------------------------------------------------ Zonas operativas
  /zonas:
    get:
      summary: Lista de zonas operativas (geom en GeoJSON lon/lat)
      description: >
        Sin bbox devuelve un arreglo con las primeras zonas (hasta limit; por defecto 2000, nunca todas sin tope), con la
        cantidad real en el encabezado X-Total-Count y X-Truncado=true si quedaron afuera. Con bbox devuelve solo las
        del rectángulo visible, hasta limit, como {items, total, truncado}: es lo que usan los ABM
        para no cargar miles de objetos en el navegador.
      tags: [zonas]
      parameters:
        - $ref: "#/components/parameters/Bbox"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - { type: array, items: { $ref: "#/components/schemas/Zona" } }
                  - allOf:
                      - $ref: "#/components/schemas/ListadoPorZona"
                      - { properties: { items: { type: array, items: { $ref: "#/components/schemas/Zona" } } } }
        "400": { $ref: "#/components/responses/DatosInvalidos" }
    post:
      summary: Crear zona (valida los datos; las zonas pueden superponerse)
      tags: [zonas]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ZonaInput" }
      responses:
        "201": { description: Creada, content: { application/json: { schema: { $ref: "#/components/schemas/IdCreado" } } } }
        "400": { $ref: "#/components/responses/DatosInvalidos" }

  /zonas/{id}:
    put:
      summary: Editar zona (misma validación; las zonas pueden superponerse)
      tags: [zonas]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ZonaInput" } } }
      responses:
        "200": { description: Actualizada }
        "400": { $ref: "#/components/responses/DatosInvalidos" }
        "404": { $ref: "#/components/responses/NoExiste" }
    delete:
      summary: Eliminar zona
      tags: [zonas]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "204": { description: Eliminada }
        "404": { $ref: "#/components/responses/NoExiste" }

  # ---------------------------------------------------------------------- Recursos
  /recursos:
    get:
      summary: Lista de recursos de emergencia (geom en GeoJSON lon/lat)
      description: Igual que GET /zonas - sin bbox, arreglo acotado (X-Total-Count, X-Truncado); con bbox, {items, total, truncado}.
      tags: [recursos]
      parameters:
        - $ref: "#/components/parameters/Bbox"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - { type: array, items: { $ref: "#/components/schemas/Recurso" } }
                  - allOf:
                      - $ref: "#/components/schemas/ListadoPorZona"
                      - { properties: { items: { type: array, items: { $ref: "#/components/schemas/Recurso" } } } }
        "400": { $ref: "#/components/responses/DatosInvalidos" }
    post:
      summary: Crear recurso
      tags: [recursos]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RecursoInput" } } }
      responses:
        "201": { description: Creado, content: { application/json: { schema: { $ref: "#/components/schemas/IdCreado" } } } }
        "400": { $ref: "#/components/responses/DatosInvalidos" }

  /recursos/{id}:
    put:
      summary: Editar recurso
      tags: [recursos]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RecursoInput" } } }
      responses:
        "200": { description: Actualizado }
        "400": { $ref: "#/components/responses/DatosInvalidos" }
        "404": { $ref: "#/components/responses/NoExiste" }
    delete:
      summary: Eliminar recurso (se quita también de las asignaciones a incidentes)
      tags: [recursos]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "204": { description: Eliminado }
        "404": { $ref: "#/components/responses/NoExiste" }

  # -------------------------------------------------------------------- Incidentes
  /incidentes:
    get:
      summary: Lista incidentes, opcionalmente filtrados por bbox
      description: >
        Sin bbox devuelve un arreglo con los primeros incidentes (hasta limit; por defecto 2000), con X-Total-Count y
        X-Truncado en los encabezados. Con bbox devuelve {items, total, truncado}.
        El bbox usa EPSG:4326 y el orden oeste,sur,este,norte (minLon,minLat,maxLon,maxLat);
        PostGIS filtra las geometrías almacenadas en EPSG:32721. geom contiene GeoJSON serializado
        como texto y puede ser Point, LineString o Polygon en EPSG:4326.
      tags: [incidentes]
      parameters:
        - $ref: "#/components/parameters/Bbox"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - { type: array, items: { $ref: "#/components/schemas/Incidente" } }
                  - allOf:
                      - $ref: "#/components/schemas/ListadoPorZona"
                      - { properties: { items: { type: array, items: { $ref: "#/components/schemas/Incidente" } } } }
        "400": { $ref: "#/components/responses/DatosInvalidos" }
    post:
      summary: Registrar incidente (siempre nace en estado "Registrado")
      description: La ubicación (geomGeoJson) puede ser un punto, una línea o un polígono; ver IncidenteInput.
      tags: [incidentes]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/IncidenteInput" } } }
      responses:
        "201": { description: Creado, content: { application/json: { schema: { $ref: "#/components/schemas/IdCreado" } } } }
        "400": { $ref: "#/components/responses/DatosInvalidos" }

  /incidentes/{id}:
    put:
      summary: Editar los datos del incidente (NO su estado -- para eso está /avanzar)
      tags: [incidentes]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/IncidenteInput" } } }
      responses:
        "200": { description: Actualizado }
        "400": { $ref: "#/components/responses/DatosInvalidos" }
        "404": { $ref: "#/components/responses/NoExiste" }
    delete:
      summary: Eliminar incidente
      tags: [incidentes]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "204": { description: Eliminado }
        "404": { $ref: "#/components/responses/NoExiste" }

  /incidentes/{id}/avanzar:
    post:
      summary: >
        Cambia el estado del incidente al indicado, si la transición es válida desde
        el estado actual (ver el diagrama de estados en docs/diagramas/arquitectura.md
        -- SUPUESTO a confirmar con el tutor).
      tags: [incidentes]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado: { type: string, enum: [Registrado, "En atención", Derivado, Resuelto, Cancelado] }
      responses:
        "200": { description: Estado actualizado }
        "400": { description: Estado destino inválido }
        "404": { $ref: "#/components/responses/NoExiste" }
        "409": { description: 'La transición no es válida desde el estado actual (ej. "No se puede pasar de Resuelto a Cancelado")' }

  /incidentes/{id}/historial:
    get:
      summary: Histórico de estados del incidente (estado, fecha y hora, usuario)
      tags: [incidentes]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: OK } }

  /incidentes/{id}/recursos:
    get:
      summary: Recursos asignados al incidente
      tags: [incidentes]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: OK } }

  /incidentes/{id}/recursos/{recursoId}:
    post:
      summary: >
        Asigna un recurso existente al incidente. SUPUESTO a confirmar con el tutor:
        relación N a M (ver db/migrations/V1__init.sql).
      tags: [incidentes]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: recursoId, in: path, required: true, schema: { type: integer } }
      responses:
        "201": { description: Asignado }
        "400": { description: "El incidente o el recurso no existen" }
    delete:
      summary: Quita la asignación de un recurso a un incidente
      tags: [incidentes]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: recursoId, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Desasignado }
        "404": { description: No estaba asignado }

  # --------------------------------------------------------- Consultas geográficas
# Consultas "a demanda": cada consulta devuelve ya la geometría de lo que encontró (campo "geom", GeoJSON
# en lon/lat como texto) para que el navegador no tenga que cargar todos los objetos. Las que pueden dar muchas
# filas aceptan ?limit= (500 por defecto, máximo 2000; el ranking de zonas, 50) y responden
# {items, total, truncado}: C1, C2 (y su extra por km²), C6, C7 y el reporte.
  /consultas/buscar:
    get:
      summary: >
        Auxiliar de las consultas. Busca por texto una zona, un incidente o un recurso para elegirlo sin
        cargar la lista completa. Devuelve hasta "limite" resultados (10 por defecto, máximo 25) con su
        etiqueta y su geometría (GeoJSON lon/lat como texto en "geom"), más los datos que hacen falta para dibujar
        el ícono y mostrar el resultado: de una zona, el nombre y nivelPrioridad; de un incidente, titulo,
        tipoIncidente, estado y prioridad; de un recurso, identificacion, tipo y estadoOperativo. Lo usan los
        desplegables con búsqueda (por ejemplo, elegir el incidente y el recurso en "Tiempo de llegada").
      tags: [consultas]
      parameters:
        - { name: tipo, in: query, required: true, schema: { type: string, enum: [zona, incidente, recurso] } }
        - { name: q, in: query, required: false, schema: { type: string }, description: "Texto a buscar; vacío devuelve los primeros" }
        - { name: limite, in: query, required: false, schema: { type: integer, default: 10 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    etiqueta: { type: string }
                    nivelPrioridad: { type: integer, description: "Solo zonas" }
                    titulo: { type: string, description: "Solo incidentes" }
                    tipoIncidente: { type: string, description: "Solo incidentes" }
                    estado: { type: string, description: "Solo incidentes" }
                    prioridad: { type: integer, description: "Solo incidentes" }
                    identificacion: { type: string, description: "Solo recursos" }
                    tipo: { type: string, description: "Solo recursos" }
                    estadoOperativo: { type: string, description: "Solo recursos" }
                    geom: { type: string, description: GeoJSON en lon/lat }
        "400": { description: tipo inválido }

  /consultas/incidentes-por-zona/{zonaId}:
    get:
      summary: C1. Incidentes que tocan la zona dada (con su geometría; responde {items, total, truncado})
      tags: [consultas]
      parameters: [{ name: zonaId, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: OK } }

  /consultas/zonas-mas-incidentes:
    get:
      summary: >
        C2. Zonas ordenadas por cantidad de incidentes, opcionalmente en un rango de fechas y solo las que están en
        la parte visible del mapa (bbox). Con geometría; responde {items, total, truncado} (las 50 primeras por defecto).
      tags: [consultas]
      parameters:
        - { name: desde, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: hasta, in: query, required: false, schema: { type: string, format: date-time } }
        - $ref: "#/components/parameters/Bbox"
        - $ref: "#/components/parameters/Limit"
      responses: { "200": { description: OK } }

  /consultas/recursos-cercanos/{incidenteId}/analisis-vial:
    get:
      summary: >
        C3. Los recursos más cercanos a un incidente (operador <-> con índice GiST), con su distancia directa
        (ST_Distance) y, con conRutas=true, el recorrido por calles (pgRouting) de los 5 más cercanos, por el camino de
        menor distancia. Para incidentes LineString/Polygon se usa el punto del incidente más cercano al recurso. Los
        tiempos no incluyen tráfico en tiempo real.
      tags: [consultas]
      parameters:
        - { name: incidenteId, in: path, required: true, schema: { type: integer } }
        - { name: limite, in: query, required: false, schema: { type: integer, default: 5, minimum: 1, maximum: 10 }, description: Cuántos recursos (los más cercanos) }
        - { name: soloDisponibles, in: query, required: false, schema: { type: boolean, default: true } }
        - { name: conRutas, in: query, required: false, schema: { type: boolean, default: false }, description: "true: calcula la ruta por calles (máx. 5 recursos, plazo total 25 s)" }
      responses:
        "200":
          description: >
            { incidenteId, soloDisponibles, conRutas, incidente, rutasMaximas,
            rutasDisponibles, recursoMasCercanoId (el de menor distancia por calles entre los que tienen ruta),
            items[{ recursoId, identificacion, tipo, estadoOperativo, geom, distanciaDirectaM,
            estadoRuta (no_calculada|disponible|sin_ruta|error|plazo_agotado), mensajeRuta,
            distanciaViaM, duracionS, tiempoEstimadoMinutos, geometriaRuta, ajusteOrigenM, ajusteDestinoM,
            calles, advertencia }] }
        "400": { description: limite inválido }
        "404": { description: Incidente inexistente }
        "503": { description: "conRutas=true y falta pgRouting, la red vial o la función de rutas en la base" }

  /consultas/incidente-mas-cercano:
    get:
      summary: >
        C4. Búsqueda de incidente. Incidente más cercano a un punto. El punto se manda en metros (x, y en EPSG:32721) o
        en grados (lon, lat en EPSG:4326, p. ej. un clic en el mapa; PostGIS lo convierte).
        Resolver antes la dirección/intersección a coordenada.
      tags: [consultas]
      parameters:
        - { name: x, in: query, required: false, schema: { type: number }, description: "Este, EPSG:32721 (junto con y)" }
        - { name: y, in: query, required: false, schema: { type: number }, description: "Norte, EPSG:32721 (junto con x)" }
        - { name: lon, in: query, required: false, schema: { type: number }, description: "Longitud, EPSG:4326 (junto con lat)" }
        - { name: lat, in: query, required: false, schema: { type: number }, description: "Latitud, EPSG:4326 (junto con lon)" }
      responses:
        "200": { description: OK }
        "400": { description: Falta la coordenada (ni x,y ni lon,lat) }

  /consultas/zona-por-punto:
    get:
      summary: >
        C5. Búsqueda de zona. Zonas que contienen un punto, en metros (x, y en EPSG:32721) o en grados (lon, lat en
        EPSG:4326). Las zonas pueden superponerse, así que devuelve todas las que lo contienen (de mayor a menor
        prioridad), con su geometría. Resolver antes la dirección a coordenada.
      tags: [consultas]
      parameters:
        - { name: x, in: query, required: false, schema: { type: number }, description: "Este, EPSG:32721 (junto con y)" }
        - { name: y, in: query, required: false, schema: { type: number }, description: "Norte, EPSG:32721 (junto con x)" }
        - { name: lon, in: query, required: false, schema: { type: number }, description: "Longitud, EPSG:4326 (junto con lat)" }
        - { name: lat, in: query, required: false, schema: { type: number }, description: "Latitud, EPSG:4326 (junto con lon)" }
      responses:
        "200": { description: "OK; responde {items, total, truncado}; si el punto no cae en ninguna zona, items vacío" }
        "400": { description: Falta la coordenada (ni x,y ni lon,lat) }

  /consultas/calles:
    get:
      summary: >
        Auxiliar de C4 y C5. Nombres de calle de TODO el país que contienen el texto dado (mínimo 2 letras; vacío si es
        menos), sin distinguir mayúsculas ni tildes, con los que empiezan por él primero y después los más repetidos.
        Máximo 10. Para el autocompletado de intersecciones. Sale de la red vial de OpenStreetMap (red_vial_arco).
      tags: [consultas]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { type: string } }

  /consultas/interseccion:
    get:
      summary: >
        Auxiliar de C4 y C5. Lugares donde se cruzan dos calles en TODO el país (lon/lat, EPSG:4326), calculados en PostGIS
        sobre la red vial de OpenStreetMap: un cruce es una esquina (vértice del grafo) a la que llegan un tramo de cada
        calle. Sin distinguir mayúsculas, tildes ni abreviaturas (Av. = AVENIDA); si no hay calles con ese nombre exacto se
        buscan las que lo contienen. Como una calle se repite en muchas localidades, devuelve hasta 10 cruces del más cercano
        al punto "cerca" (por defecto el centro de Salto), cada uno con la ciudad, pueblo o barrio más próximo. Lista vacía si
        no se cruzan o algún nombre no existe. El resultado se usa como lon/lat en /consultas/incidente-mas-cercano y
        /consultas/zona-por-punto.
      tags: [consultas]
      parameters:
        - { name: calle1, in: query, required: true, schema: { type: string }, description: "Nombre de la calle (ver /consultas/calles)" }
        - { name: calle2, in: query, required: true, schema: { type: string } }
        - { name: cercaLon, in: query, required: false, schema: { type: number }, description: "Longitud del punto al que ordenar los cruces (por defecto Salto)" }
        - { name: cercaLat, in: query, required: false, schema: { type: number }, description: "Latitud del punto al que ordenar los cruces (por defecto Salto)" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    lon: { type: number }
                    lat: { type: number }
                    lugar: { type: string, nullable: true, description: "Ciudad, pueblo o barrio más próximo (OpenStreetMap)" }
                    lugarTipo: { type: string, nullable: true, description: "city, town, village, hamlet, suburb o neighbourhood" }
                    distanciaLugarM: { type: number, nullable: true }
                    distanciaKm: { type: number, description: "Distancia al punto cerca, en km" }
        "400": { description: Falta una de las dos calles }

  /consultas/geocodificar:
    get:
      summary: >
        Auxiliar de C4 y C5. Ubica una dirección "calle número" (por ejemplo "Camino Carrasco 4680")
        y devuelve lon/lat (EPSG:4326). Se busca en la tabla acceso, los números de puerta de
        Salto (es también la capa "acceso" de GeoServer), sin tildes, con las palabras completas
        ("Av." = AVENIDA, "Gral" = GENERAL, "Dr" = DOCTOR) y tolerando errores de tipeo. Si el número no
        existe se devuelve la puerta más cercana de la calle y se marca "aproximada". La tabla de puertas es
        solo de Salto: con otro departamento o localidad, o con el parámetro esquina, se usa el servicio de
        direcciones de la IDE de Uruguay, que cubre todo el país (requiere internet). Con departamento=todo la
        dirección se busca en TODO el país: primero en las puertas de Salto y, si no está, en la IDE sin fijar
        departamento; se elige la mejor coincidencia (la del portal exacto) y las otras se devuelven en "alternativas".
        Sin departamento ni localidad se usan los configurados en el backend (IDE_DEPARTAMENTO e IDE_LOCALIDAD,
        por defecto Salto).
        El resultado se usa como lon/lat en
        /consultas/incidente-mas-cercano y /consultas/zona-por-punto.
      tags: [consultas]
      parameters:
        - { name: direccion, in: query, required: true, schema: { type: string }, description: "Por ejemplo: Buenos Aires 451" }
        - { name: esquina, in: query, required: false, schema: { type: string }, description: "Segunda calle: ubica la esquina de direccion y esquina (siempre con la IDE)" }
        - { name: departamento, in: query, required: false, schema: { type: string }, description: "Departamento donde buscar (por defecto, el de IDE_DEPARTAMENTO: salto), o todo para buscar en todo el país. Fuera de Salto se usa la IDE, que cubre todo el país; solo con el departamento busca en todo el departamento" }
        - { name: localidad, in: query, required: false, schema: { type: string }, description: "Localidad (opcional; si se indicó el departamento y no la localidad, se busca en todo el departamento; si no, la de IDE_LOCALIDAD)" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  direccion: { type: string, description: Dirección normalizada }
                  lon: { type: number }
                  lat: { type: number }
                  aproximada: { type: boolean }
                  aviso: { type: string, nullable: true }
                  fuente: { type: string, description: "Puertas de Salto (tabla local) o IDE para otras localidades" }
                  departamento: { type: string, description: "Donde se encontró (la IDE lo informa)" }
                  localidad: { type: string }
                  alternativas:
                    type: array
                    description: "Solo con departamento=todo: otras coincidencias de la calle en el país (hasta 5)"
                    items:
                      type: object
                      properties:
                        direccion: { type: string }
                        departamento: { type: string }
                        localidad: { type: string }
                        lon: { type: number }
                        lat: { type: number }
                        aproximada: { type: boolean }
        "400": { description: Falta la dirección }
        "404": { description: No se encontró la calle (solo con el respaldo de la IDE) }
        "502": { description: Respaldo de la IDE no disponible (sin internet) }

  /consultas/tipos-incidente:
    get:
      summary: Tipos de incidente que existen (valores distintos), para armar filtros
      tags: [consultas]
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { type: string } }

  /consultas/recursos-por-zona/{zonaId}:
    get:
      summary: C6. Recursos ubicados dentro de la zona dada
      tags: [consultas]
      parameters: [{ name: zonaId, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: OK } }

  /consultas/incidentes-por-recurso/{recursoId}:
    get:
      summary: C7. Incidentes atendidos/asociados a un recurso
      tags: [consultas]
      parameters: [{ name: recursoId, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: OK } }

  /consultas/reportes/incidentes-por-zona:
    get:
      summary: >
        Reporte de incidentes (requerimiento del administrador, distinto de la
        consulta geográfica homónima): filtrable, agrupado por zona.
      tags: [consultas]
      parameters:
        - { name: zonaId, in: query, required: false, schema: { type: integer } }
        - { name: tipo, in: query, required: false, schema: { type: string } }
        - { name: prioridad, in: query, required: false, schema: { type: integer } }
        - { name: estado, in: query, required: false, schema: { type: string } }
        - { name: desde, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: hasta, in: query, required: false, schema: { type: string, format: date-time } }
      responses: { "200": { description: OK } }

  # -------------------------------------------------------------------------- Fotos
  /fotos:
    post:
      summary: >
        Subida de imágenes, genérica (no depende de ninguna entidad). Construida para
        el opcional "Fotos" de GeoTravel; la letra de UrbanSafe no pide fotos, así que
        hoy ningún formulario la usa -- queda disponible por si se necesita más adelante.
      tags: [media]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo]
              properties:
                archivo: { type: string, format: binary, description: "JPG, PNG, GIF o WEBP, máx. 5 MB" }
      responses:
        "201":
          description: Subida
          content:
            application/json:
              schema: { type: object, properties: { url: { type: string } } }
        "400": { $ref: "#/components/responses/DatosInvalidos" }
        "413": { description: La imagen supera 5 MB }

  /fotos/{nombre}:
    get:
      summary: Descargar una foto subida
      tags: [media]
      parameters: [{ name: nombre, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: La imagen }
        "404": { $ref: "#/components/responses/NoExiste" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    Bbox:
      name: bbox
      in: query
      required: false
      description: >
        Rectángulo visible del mapa en lon/lat (EPSG:4326) - oeste,sur,este,norte, el formato de
        Leaflet map.getBounds().toBBoxString(). Se recorta a la extensión de Uruguay.
      schema: { type: string, example: "-57.995,-31.405,-57.925,-31.365" }
    Limit:
      name: limit
      in: query
      required: false
      description: Máximo de objetos a devolver (máximo 2000). Por defecto 500 con bbox y 2000 sin bbox.
      schema: { type: integer, minimum: 1, maximum: 2000, default: 500 }
  responses:
    DatosInvalidos:
      description: Datos inválidos
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NoExiste:
      description: No existe
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  schemas:
    ListadoPorZona:
      type: object
      description: Respuesta de los listados a demanda (con bbox).
      properties:
        items: { type: array, items: { type: object } }
        total: { type: integer, description: Cuántos objetos hay en el rectángulo }
        truncado: { type: boolean, description: true si quedaron objetos afuera por el límite }
    Error:
      type: object
      properties: { error: { type: string } }
    IdCreado:
      type: object
      properties: { id: { type: integer } }
    Zona:
      type: object
      properties:
        id: { type: integer }
        nombre: { type: string }
        descripcion: { type: string }
        nivelPrioridad: { type: integer, minimum: 1, maximum: 5, description: "1 = máxima prioridad" }
        responsable: { type: string }
        observaciones: { type: string }
        geom: { type: string, description: "GeoJSON Polygon en lon/lat (EPSG:4326), como texto: hacer JSON.parse" }
    ZonaInput:
      type: object
      required: [nombre, nivelPrioridad, geomGeoJson]
      properties:
        nombre: { type: string }
        descripcion: { type: string }
        nivelPrioridad: { type: integer, minimum: 1, maximum: 5 }
        responsable: { type: string }
        observaciones: { type: string }
        geomGeoJson: { type: string, description: "GeoJSON Polygon en lon/lat, como TEXTO (JSON.stringify)" }
    Recurso:
      type: object
      properties:
        id: { type: integer }
        identificacion: { type: string }
        nombre: { type: string }
        tipo: { type: string, enum: [ambulancia, bomberos, patrulla, centro_atencion, otro] }
        estadoOperativo: { type: string, enum: [Disponible, "En servicio", "Fuera de servicio"] }
        descripcion: { type: string }
        geom: { type: string, description: "GeoJSON Point, LineString o Polygon en lon/lat (EPSG:4326), como texto" }
    RecursoInput:
      type: object
      required: [identificacion, tipo, estadoOperativo, geomGeoJson]
      properties:
        identificacion: { type: string }
        nombre: { type: string }
        tipo:
          type: string
          enum: [ambulancia, bomberos, patrulla, centro_atencion, otro]
          description: >
            Lista cerrada: son los tipos que dibuja geoserver/styles/recursos_tipo.sld.
            Se normaliza a minúsculas; cualquier otro valor responde 400.
        estadoOperativo: { type: string, enum: [Disponible, "En servicio", "Fuera de servicio"] }
        descripcion: { type: string }
        geomGeoJson: { type: string, description: "Ubicación como TEXTO GeoJSON en lon/lat: Point (un lugar), LineString (un tramo, una calle cortada) o Polygon (un área). Cualquier otra cosa, o una forma inválida (un polígono que se cruza), da 400" }
    Incidente:
      type: object
      properties:
        id: { type: integer }
        titulo: { type: string }
        descripcion: { type: string }
        tipoIncidente: { type: string }
        prioridad: { type: integer, minimum: 1, maximum: 5 }
        estado: { type: string, enum: [Registrado, "En atención", Derivado, Resuelto, Cancelado] }
        fechaHoraRegistro: { type: string, format: date-time }
        equipoResponsable: { type: string }
        geom: { type: string, description: "GeoJSON Point en lon/lat (EPSG:4326), como texto" }
    IncidenteInput:
      type: object
      required: [titulo, tipoIncidente, prioridad, geomGeoJson]
      properties:
        titulo: { type: string }
        descripcion: { type: string }
        tipoIncidente: { type: string }
        prioridad: { type: integer, minimum: 1, maximum: 5 }
        equipoResponsable: { type: string }
        geomGeoJson: { type: string, description: "GeoJSON Point en lon/lat, como TEXTO" }
