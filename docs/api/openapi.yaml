openapi: 3.0.3
info:
  title: UrbanSafe API
  version: "0.2.0"
  description: >
    Contrato REST del backend. Actualizar este archivo en el mismo PR que agregue
    o cambie un endpoint (ver CONTRIBUTING.md). Base path real: /geotravel/api
    (definido en backend/src/main/webapp/WEB-INF/web.xml; el nombre del artefacto
    quedó como "geotravel" por continuidad con el repo, no tiene que ver con el
    dominio del proyecto).

    Convención de coordenadas: los cuerpos de alta/edición (geomGeoJson) van en
    GeoJSON lon/lat (EPSG:4326) -- es lo que produce Leaflet. Los parámetros x/y de
    las consultas geográficas van en EPSG:32721 (metros), el SRID de la base.
servers:
  - url: http://localhost:8080/geotravel/api

paths:
  /health:
    get:
      summary: Estado del servicio
      responses:
        "200": { description: OK }

  # ------------------------------------------------------------ Zonas operativas
  /zonas:
    get:
      summary: Lista de zonas operativas (geom en GeoJSON lon/lat)
      tags: [zonas]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Zona" } }
    post:
      summary: Crear zona (valida datos y que no se superponga con otra)
      tags: [zonas]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ZonaInput" }
      responses:
        "201": { description: Creada, content: { application/json: { schema: { $ref: "#/components/schemas/IdCreado" } } } }
        "400": { $ref: "#/components/responses/DatosInvalidos" }
        "409": { $ref: "#/components/responses/ZonaSuperpuesta" }

  /zonas/{id}:
    put:
      summary: Editar zona (misma validación; la zona no cuenta como superpuesta consigo misma)
      tags: [zonas]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ZonaInput" } } }
      responses:
        "200": { description: Actualizada }
        "400": { $ref: "#/components/responses/DatosInvalidos" }
        "404": { $ref: "#/components/responses/NoExiste" }
        "409": { $ref: "#/components/responses/ZonaSuperpuesta" }
    delete:
      summary: Eliminar zona
      tags: [zonas]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "204": { description: Eliminada }
        "404": { $ref: "#/components/responses/NoExiste" }

  # ---------------------------------------------------------------------- Recursos
  /recursos:
    get:
      summary: Lista de recursos de emergencia (geom en GeoJSON lon/lat)
      tags: [recursos]
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Recurso" } } } }
    post:
      summary: Crear recurso
      tags: [recursos]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RecursoInput" } } }
      responses:
        "201": { description: Creado, content: { application/json: { schema: { $ref: "#/components/schemas/IdCreado" } } } }
        "400": { $ref: "#/components/responses/DatosInvalidos" }

  /recursos/{id}:
    put:
      summary: Editar recurso
      tags: [recursos]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RecursoInput" } } }
      responses:
        "200": { description: Actualizado }
        "400": { $ref: "#/components/responses/DatosInvalidos" }
        "404": { $ref: "#/components/responses/NoExiste" }
    delete:
      summary: Eliminar recurso (se quita también de las asignaciones a incidentes)
      tags: [recursos]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "204": { description: Eliminado }
        "404": { $ref: "#/components/responses/NoExiste" }

  # -------------------------------------------------------------------- Incidentes
  /incidentes:
    get:
      summary: Lista de incidentes (geom en GeoJSON lon/lat)
      tags: [incidentes]
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Incidente" } } } }
    post:
      summary: Registrar incidente (siempre nace en estado "Registrado")
      tags: [incidentes]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/IncidenteInput" } } }
      responses:
        "201": { description: Creado, content: { application/json: { schema: { $ref: "#/components/schemas/IdCreado" } } } }
        "400": { $ref: "#/components/responses/DatosInvalidos" }

  /incidentes/{id}:
    put:
      summary: Editar los datos del incidente (NO su estado -- para eso está /avanzar)
      tags: [incidentes]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/IncidenteInput" } } }
      responses:
        "200": { description: Actualizado }
        "400": { $ref: "#/components/responses/DatosInvalidos" }
        "404": { $ref: "#/components/responses/NoExiste" }
    delete:
      summary: Eliminar incidente
      tags: [incidentes]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "204": { description: Eliminado }
        "404": { $ref: "#/components/responses/NoExiste" }

  /incidentes/{id}/avanzar:
    post:
      summary: >
        Cambia el estado del incidente al indicado, si la transición es válida desde
        el estado actual (ver el diagrama de estados en docs/diagramas/arquitectura.md
        -- SUPUESTO a confirmar con el tutor).
      tags: [incidentes]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado: { type: string, enum: [Registrado, "En atención", Derivado, Resuelto, Cancelado] }
                usuario: { type: string, description: "Quién hace el cambio (sin login real: texto libre, opcional)" }
      responses:
        "200": { description: Estado actualizado }
        "400": { description: Estado destino inválido }
        "404": { $ref: "#/components/responses/NoExiste" }
        "409": { description: 'La transición no es válida desde el estado actual (ej. "No se puede pasar de Resuelto a Cancelado")' }

  /incidentes/{id}/historial:
    get:
      summary: Histórico de estados del incidente (estado, fecha y hora, usuario)
      tags: [incidentes]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: OK } }

  /incidentes/{id}/recursos:
    get:
      summary: Recursos asignados al incidente
      tags: [incidentes]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: OK } }

  /incidentes/{id}/recursos/{recursoId}:
    post:
      summary: >
        Asigna un recurso existente al incidente. SUPUESTO a confirmar con el tutor:
        relación N a M (ver db/migrations/V1__init.sql).
      tags: [incidentes]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: recursoId, in: path, required: true, schema: { type: integer } }
      responses:
        "201": { description: Asignado }
        "400": { description: "El incidente o el recurso no existen" }
    delete:
      summary: Quita la asignación de un recurso a un incidente
      tags: [incidentes]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: recursoId, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Desasignado }
        "404": { description: No estaba asignado }

  # --------------------------------------------------------- Consultas geográficas
  /consultas/incidentes-por-zona/{zonaId}:
    get:
      summary: C1. Incidentes dentro de la zona dada
      tags: [consultas]
      parameters: [{ name: zonaId, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: OK } }

  /consultas/zonas-mas-incidentes:
    get:
      summary: C2. Zonas ordenadas por cantidad de incidentes, opcionalmente en un rango de fechas
      tags: [consultas]
      parameters:
        - { name: desde, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: hasta, in: query, required: false, schema: { type: string, format: date-time } }
      responses: { "200": { description: OK } }

  /consultas/zonas-mayor-concentracion:
    get:
      summary: >
        C8. Zonas ordenadas por incidentes/km² (concentración normalizada por área).
        AMBIGÜEDAD EN LA LETRA: no queda claro si difiere de "zonas-mas-incidentes"
        -- confirmar con el tutor el criterio esperado. Opcionalmente en un rango de fechas.
      tags: [consultas]
      parameters:
        - { name: desde, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: hasta, in: query, required: false, schema: { type: string, format: date-time } }
      responses: { "200": { description: OK } }

  /consultas/recursos-cercanos/{incidenteId}:
    get:
      summary: C3. Los N recursos más cercanos al incidente dado (por defecto 5)
      tags: [consultas]
      parameters:
        - { name: incidenteId, in: path, required: true, schema: { type: integer } }
        - { name: limite, in: query, required: false, schema: { type: integer, default: 5 } }
        - { name: soloDisponibles, in: query, required: false, schema: { type: boolean, default: false }, description: "true: solo recursos en estado Disponible" }
      responses: { "200": { description: OK } }

  /consultas/incidente-mas-cercano:
    get:
      summary: >
        C4. Búsqueda de incidente. Incidente más cercano a un punto. El punto se manda en metros (x, y en EPSG:32721) o
        en grados (lon, lat en EPSG:4326, p. ej. un clic en el mapa; PostGIS lo convierte).
        Resolver antes la dirección/intersección a coordenada.
      tags: [consultas]
      parameters:
        - { name: x, in: query, required: false, schema: { type: number }, description: "Este, EPSG:32721 (junto con y)" }
        - { name: y, in: query, required: false, schema: { type: number }, description: "Norte, EPSG:32721 (junto con x)" }
        - { name: lon, in: query, required: false, schema: { type: number }, description: "Longitud, EPSG:4326 (junto con lat)" }
        - { name: lat, in: query, required: false, schema: { type: number }, description: "Latitud, EPSG:4326 (junto con lon)" }
      responses:
        "200": { description: OK }
        "400": { description: Falta la coordenada (ni x,y ni lon,lat) }

  /consultas/zona-por-punto:
    get:
      summary: >
        C5. Búsqueda de zona. Zona que contiene un punto, en metros (x, y en EPSG:32721) o en grados (lon, lat en
        EPSG:4326). Resolver antes la dirección a coordenada.
      tags: [consultas]
      parameters:
        - { name: x, in: query, required: false, schema: { type: number }, description: "Este, EPSG:32721 (junto con y)" }
        - { name: y, in: query, required: false, schema: { type: number }, description: "Norte, EPSG:32721 (junto con x)" }
        - { name: lon, in: query, required: false, schema: { type: number }, description: "Longitud, EPSG:4326 (junto con lat)" }
        - { name: lat, in: query, required: false, schema: { type: number }, description: "Latitud, EPSG:4326 (junto con lon)" }
      responses:
        "200": { description: "OK; si el punto no cae en ninguna zona devuelve {\"zona\": null}" }
        "400": { description: Falta la coordenada (ni x,y ni lon,lat) }

  /consultas/por-figura:
    post:
      summary: >
        Extra. Qué incidentes, recursos y zonas hay dentro de, o a lo largo de, una línea o un polígono
        dibujado en el mapa. Polígono: distancia 0 por defecto (lo de adentro). Línea: 200 m por
        defecto (un pasillo a lo largo de ella). Con distancia > 0 se agranda la figura (ST_Buffer)
        y ese área se devuelve en "area" para dibujarla. Cada lista trae como máximo 200 filas
        (las más cercanas) y el total real.
      tags: [consultas]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [geomGeoJson]
              properties:
                geomGeoJson: { type: string, description: "LineString o Polygon en lon/lat (EPSG:4326), como texto GeoJSON" }
                distanciaM: { type: number, minimum: 0, maximum: 10000 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  tipo: { type: string, enum: [LineString, Polygon] }
                  distanciaM: { type: number }
                  largoM: { type: number, description: "Solo líneas (ST_Length)" }
                  areaM2: { type: number, description: "Solo polígonos (ST_Area)" }
                  perimetroM: { type: number, description: "Solo polígonos (ST_Perimeter)" }
                  area: { type: string, nullable: true, description: "GeoJSON del área buscada; null si la distancia es 0" }
                  incidentes: { type: object, properties: { total: { type: integer }, filas: { type: array, items: { type: object } } } }
                  recursos: { type: object, properties: { total: { type: integer }, filas: { type: array, items: { type: object } } } }
                  zonas: { type: array, items: { type: object } }
        "400": { description: Figura ausente, GeoJSON inválido, que no es línea ni polígono, no válida (se cruza consigo misma) o distancia fuera de rango }

  /consultas/calles:
    get:
      summary: >
        Auxiliar de C4 y C5. Nombres de calle que contienen el texto dado (mínimo 2 letras; vacío si es menos), con
        los que empiezan por él primero. Máximo 10. Para el autocompletado de intersecciones.
      tags: [consultas]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { type: string } }

  /consultas/interseccion:
    get:
      summary: >
        Auxiliar de C4 y C5. Puntos donde se cruzan dos calles (lon/lat, EPSG:4326), calculados en PostGIS sobre la
        red vial (tabla via). Lista vacía si no se cruzan o algún nombre no existe; varios
        elementos si hay nombres repetidos en la ciudad. El resultado se usa como lon/lat en
        /consultas/incidente-mas-cercano y /consultas/zona-por-punto.
      tags: [consultas]
      parameters:
        - { name: calle1, in: query, required: true, schema: { type: string }, description: "Nombre exacto, sin distinguir mayúsculas (ver /consultas/calles)" }
        - { name: calle2, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    lon: { type: number }
                    lat: { type: number }
        "400": { description: Falta una de las dos calles }

  /consultas/geocodificar:
    get:
      summary: >
        Auxiliar de C4 y C5. Ubica una dirección "calle número" (por ejemplo "Camino Carrasco 4680")
        y devuelve lon/lat (EPSG:4326). Se busca en la tabla acceso, los números de puerta de
        Montevideo (capa mdg_accesos de la Intendencia; es también la capa "acceso" de GeoServer),
        tolerando abreviaturas ("Camino" = CNO, "Avenida" = AV) y errores de tipeo. Si el número no
        existe se devuelve la puerta más cercana de la calle y se marca "aproximada". Lo que no se
        resuelve ahí (por ejemplo "calle esquina calle") se pasa al servicio de direcciones de la IDE
        de Uruguay (requiere internet). El resultado se usa como lon/lat en
        /consultas/incidente-mas-cercano y /consultas/zona-por-punto.
      tags: [consultas]
      parameters:
        - { name: direccion, in: query, required: true, schema: { type: string }, description: "Por ejemplo: Buenos Aires 451" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  direccion: { type: string, description: Dirección normalizada }
                  lon: { type: number }
                  lat: { type: number }
                  aproximada: { type: boolean }
                  aviso: { type: string, nullable: true }
                  fuente: { type: string, description: "Puertas de Montevideo, o IDE si se usó el respaldo" }
        "400": { description: Falta la dirección }
        "404": { description: No se encontró la calle (solo con el respaldo de la IDE) }
        "502": { description: Respaldo de la IDE no disponible (sin internet) }

  /consultas/tipos-incidente:
    get:
      summary: Tipos de incidente que existen (valores distintos), para armar filtros
      tags: [consultas]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { type: string } }

  /consultas/recursos-por-zona/{zonaId}:
    get:
      summary: C6. Recursos ubicados dentro de la zona dada
      tags: [consultas]
      parameters: [{ name: zonaId, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: OK } }

  /consultas/incidentes-por-recurso/{recursoId}:
    get:
      summary: C7. Incidentes atendidos/asociados a un recurso
      tags: [consultas]
      parameters: [{ name: recursoId, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: OK } }

  /consultas/reportes/incidentes-por-zona:
    get:
      summary: >
        Reporte de incidentes (requerimiento del administrador, distinto de la
        consulta geográfica homónima): filtrable, agrupado por zona.
      tags: [consultas]
      parameters:
        - { name: zonaId, in: query, required: false, schema: { type: integer } }
        - { name: tipo, in: query, required: false, schema: { type: string } }
        - { name: prioridad, in: query, required: false, schema: { type: integer } }
        - { name: estado, in: query, required: false, schema: { type: string } }
        - { name: desde, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: hasta, in: query, required: false, schema: { type: string, format: date-time } }
      responses: { "200": { description: OK } }

  # -------------------------------------------------------------------------- Fotos
  /fotos:
    post:
      summary: >
        Subida de imágenes, genérica (no depende de ninguna entidad). Construida para
        el opcional "Fotos" de GeoTravel; la letra de UrbanSafe no pide fotos, así que
        hoy ningún formulario la usa -- queda disponible por si se necesita más adelante.
      tags: [media]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo]
              properties:
                archivo: { type: string, format: binary, description: "JPG, PNG, GIF o WEBP, máx. 5 MB" }
      responses:
        "201":
          description: Subida
          content:
            application/json:
              schema: { type: object, properties: { url: { type: string } } }
        "400": { $ref: "#/components/responses/DatosInvalidos" }
        "413": { description: La imagen supera 5 MB }

  /fotos/{nombre}:
    get:
      summary: Descargar una foto subida
      tags: [media]
      parameters: [{ name: nombre, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: La imagen }
        "404": { $ref: "#/components/responses/NoExiste" }

components:
  responses:
    DatosInvalidos:
      description: Datos inválidos
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    ZonaSuperpuesta:
      description: 'La zona se superpone con otra existente; el mensaje indica con cuál (ej. La zona se superpone con "Centro")'
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NoExiste:
      description: No existe
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  schemas:
    Error:
      type: object
      properties: { error: { type: string } }
    IdCreado:
      type: object
      properties: { id: { type: integer } }
    Zona:
      type: object
      properties:
        id: { type: integer }
        nombre: { type: string }
        descripcion: { type: string }
        nivelPrioridad: { type: integer, minimum: 1, maximum: 5, description: "1 = máxima prioridad" }
        responsable: { type: string }
        observaciones: { type: string }
        geom: { type: string, description: "GeoJSON Polygon en lon/lat (EPSG:4326), como texto: hacer JSON.parse" }
    ZonaInput:
      type: object
      required: [nombre, nivelPrioridad, geomGeoJson]
      properties:
        nombre: { type: string }
        descripcion: { type: string }
        nivelPrioridad: { type: integer, minimum: 1, maximum: 5 }
        responsable: { type: string }
        observaciones: { type: string }
        geomGeoJson: { type: string, description: "GeoJSON Polygon en lon/lat, como TEXTO (JSON.stringify)" }
    Recurso:
      type: object
      properties:
        id: { type: integer }
        identificacion: { type: string }
        nombre: { type: string }
        tipo: { type: string }
        estadoOperativo: { type: string, enum: [Disponible, "En servicio", "Fuera de servicio"] }
        descripcion: { type: string }
        geom: { type: string, description: "GeoJSON Point en lon/lat (EPSG:4326), como texto" }
    RecursoInput:
      type: object
      required: [identificacion, tipo, estadoOperativo, geomGeoJson]
      properties:
        identificacion: { type: string }
        nombre: { type: string }
        tipo: { type: string }
        estadoOperativo: { type: string, enum: [Disponible, "En servicio", "Fuera de servicio"] }
        descripcion: { type: string }
        geomGeoJson: { type: string, description: "GeoJSON Point en lon/lat, como TEXTO" }
    Incidente:
      type: object
      properties:
        id: { type: integer }
        titulo: { type: string }
        descripcion: { type: string }
        tipoIncidente: { type: string }
        prioridad: { type: integer, minimum: 1, maximum: 5 }
        estado: { type: string, enum: [Registrado, "En atención", Derivado, Resuelto, Cancelado] }
        fechaHoraRegistro: { type: string, format: date-time }
        equipoResponsable: { type: string }
        geom: { type: string, description: "GeoJSON Point en lon/lat (EPSG:4326), como texto" }
    IncidenteInput:
      type: object
      required: [titulo, tipoIncidente, prioridad, geomGeoJson]
      properties:
        titulo: { type: string }
        descripcion: { type: string }
        tipoIncidente: { type: string }
        prioridad: { type: integer, minimum: 1, maximum: 5 }
        equipoResponsable: { type: string }
        geomGeoJson: { type: string, description: "GeoJSON Point en lon/lat, como TEXTO" }
